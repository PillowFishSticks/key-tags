name: Unstick Pages deploy

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/pages-unstick.yml"]

permissions:
  pages: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/98b6a26640aa1e4b39761d2142089b92e19b8191/cancel" || true
          gh api "repos/${{ github.repository }}/pages/deployments/98b6a26640aa1e4b39761d2142089b92e19b8191" || true
