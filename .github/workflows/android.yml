name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run build:web

      - name: Create Android project
        run: |
          npx cap add android
          node native/patch-android.cjs
          npx cap sync android

      - name: Build APK
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../key-tags.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Key Tags Android app (latest)
          make_latest: true
          files: key-tags.apk
          body: |
            Latest Android build of Key Tags, built automatically from `main`.

            **Install:** open this page on an Android phone, tap **key-tags.apk**, then allow "install unknown apps" for your browser when asked.

            Built from ${{ github.sha }}.
