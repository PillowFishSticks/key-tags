name: Publish website

on:
  push:
    branches: [main]
    paths: ["index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub sometimes keeps the previous publish "in progress" long after it finished; wait and retry instead of failing
      - id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.try1.outcome != 'success'
        run: sleep 120

      - id: try2
        if: steps.try1.outcome != 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success'
        run: sleep 300

      - id: try3
        if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success' && steps.try3.outcome != 'success'
        run: sleep 600

      - id: try4
        if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success' && steps.try3.outcome != 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success' && steps.try3.outcome != 'success' && steps.try4.outcome != 'success'
        run: sleep 900

      - id: try5
        if: steps.try1.outcome != 'success' && steps.try2.outcome != 'success' && steps.try3.outcome != 'success' && steps.try4.outcome != 'success'
        uses: actions/deploy-pages@v4

      - id: final
        run: echo "url=${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url || steps.try4.outputs.page_url || steps.try5.outputs.page_url }}" >> "$GITHUB_OUTPUT"
