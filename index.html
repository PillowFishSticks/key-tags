<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Key Tags</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#14171c;--muted:#6b7280;--line:#e3e6ea;
  --accent:#1f6feb;--accent-ink:#fff;--good:#1a7f37;--good-bg:#e7f6ec;
  --bad:#c0362c;--bad-bg:#fdecea;--warn:#9a6700;--warn-bg:#fff6dd;
  --plate:#ffd400;--plate-front:#fff;--radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--ink:#eef0f3;--muted:#9aa3ae;--line:#2a2f37;
  --accent:#4c8dff;--good:#4ac26b;--good-bg:#12291a;--bad:#ff6b5e;--bad-bg:#2e1614;
  --warn:#e3b341;--warn-bg:#2b2410;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.who{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
nav{display:flex;gap:6px;max-width:640px;margin:10px auto 0}
nav a{flex:1;text-align:center;padding:9px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
nav a.on{background:var(--bg);color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--bg);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad);background:none;padding:8px}
button.big{width:100%;padding:15px;font-size:17px}
button:disabled{opacity:.5}
.plate{display:inline-block;font-family:"Arial Narrow",Arial,sans-serif;font-weight:800;letter-spacing:.06em;background:var(--plate);color:#111;border-radius:5px;padding:2px 8px;font-size:15px;border:1px solid #0002}
.muted{color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px}
.pill.in{background:var(--good-bg);color:var(--good)}
.pill.out{background:var(--warn-bg);color:var(--warn)}
.pill.new{background:var(--bg);color:var(--muted)}
a.vlink{color:inherit;text-decoration:none}
.panel{border:2px solid var(--accent);border-radius:var(--radius);padding:16px;margin:10px 0;background:var(--card)}
.big-count{font-size:40px;font-weight:800;line-height:1}
.dots{display:flex;gap:6px;margin:10px 0}
.dots span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots span.on{background:var(--good)}
.log{list-style:none;margin:10px 0 0;padding:0;font-size:15px}
.log li{padding:8px 10px;border-radius:8px;margin-bottom:6px}
.log .good{background:var(--good-bg);color:var(--good)}
.log .bad{background:var(--bad-bg);color:var(--bad)}
.log .warn{background:var(--warn-bg);color:var(--warn)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--card);border:1px solid var(--line);font-weight:500}
.chips button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;font-size:22px;padding:0}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.hist{font-size:14px}
.hist li{padding:8px 0;border-bottom:1px solid var(--line)}
.hist ul{list-style:none;padding:0;margin:0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:112px;color:var(--ink);text-decoration:none}
.tile .ico{font-size:28px;line-height:1.2}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.tile.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.accent span{color:var(--accent-ink);opacity:.85}
.step{display:flex;gap:10px;align-items:center;margin:20px 0 10px;font-weight:700;font-size:17px}
.step i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px;flex:none}
.step.dim{opacity:.4}
.chips.big button{padding:14px 18px;font-size:17px;font-weight:600}
.listen{display:flex;align-items:center;gap:12px;border:2px dashed var(--accent);border-radius:var(--radius);padding:16px;margin-top:6px;font-weight:600}
.listen .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.result{text-align:center;padding:20px 14px}
.result .plate{font-size:28px;padding:6px 16px}
#track{display:none;max-width:640px;margin:8px auto 0;font-size:13px;font-weight:600;border-radius:10px;padding:7px 10px;background:var(--warn-bg);color:var(--warn)}
#track.on{display:block}
#map{height:55vh;min-height:300px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:12px;z-index:0}
.mlabel{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-weight:700;font-size:12px;box-shadow:0 1px 3px #0003}
.pegs{display:grid;grid-template-columns:repeat(var(--cols,10),1fr);gap:4px;margin-top:10px}
.peg{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);cursor:pointer;padding:0;font-weight:600}
.peg.full{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.peg.notag{opacity:.35}
.peg.hit{outline:3px solid var(--accent);outline-offset:1px;background:var(--accent);color:var(--accent-ink)}
.found{font-size:17px;font-weight:700}
#offers{max-width:640px;margin:8px auto 0}
.offer{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.offer .row{margin-top:8px;gap:8px}
.offer button{flex:1;padding:10px}
.offer .yes{background:var(--card);color:var(--ink)}
.offer .no{background:transparent;color:var(--accent-ink);border:1px solid var(--accent-ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">🔑 Key Tags</div>
    <button class="who" id="who"></button>
  </div>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/keys" data-nav="keys">Keys</a>
    <a href="#/map" data-nav="map">Map</a>
    <a href="#/vehicles" data-nav="vehicles">Vehicles</a>
  </nav>
  <div id="track"></div>
  <div id="offers"></div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
/* ===== Shared data: paste your Supabase values here (leave blank = this phone only) ===== */
const SUPABASE_URL = "https://aglpudowsilwjakuqsdb.supabase.co";
const SUPABASE_KEY = "sb_publishable_YzOjKCAZX2uTlFTvKb_NhQ_0tNxVvTi";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const NFC = "NDEFReader" in window;
const PUBLIC_URL = "https://pillowfishsticks.github.io/key-tags/";
const LS = "keytags.";
const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage: Supabase if configured, else localStorage ---------- */
const store = {
  async all(kind) {
    if (sb) {
      const { data, error } = await sb.from("items").select("id,data").eq("kind", kind);
      if (error) throw error;
      return data.map(r => ({ id: r.id, ...r.data }));
    }
    try { return JSON.parse(localStorage[LS + kind] || "[]"); } catch { return []; }
  },
  async put(kind, obj) {
    if (sb) {
      const { id, ...data } = obj;
      const { error } = await sb.from("items").upsert({ id, kind, data });
      if (error) throw error;
      return;
    }
    const a = await store.all(kind);
    const i = a.findIndex(x => x.id === obj.id);
    if (i >= 0) a[i] = obj; else a.push(obj);
    localStorage[LS + kind] = JSON.stringify(a);
  },
  async putMany(kind, objs) {
    if (!objs.length) return;
    if (sb) {
      const { error } = await sb.from("items").upsert(objs.map(({ id, ...data }) => ({ id, kind, data })));
      if (error) throw error;
      return;
    }
    for (const o of objs) await store.put(kind, o);
  },
  async del(kind, id) {
    if (sb) { const { error } = await sb.from("items").delete().eq("id", id); if (error) throw error; return; }
    localStorage[LS + kind] = JSON.stringify((await store.all(kind)).filter(x => x.id !== id));
  }
};

let db = { vehicles: [], keys: [], events: [], locations: [], pos: [], pegs: [], offers: [] };
async function load() {
  const [vehicles, keys, events, locations, pos, pegs, offers] = await Promise.all(["vehicles", "keys", "events", "locations", "pos", "pegs", "offers"].map(k => store.all(k)));
  db = { vehicles, keys, events, locations, pos, pegs, offers };
  if (!db.locations.length) {
    for (const [i, n] of ["Key board 1", "Key board 2", "Key board 3"].entries()) {
      const l = { id: "l_" + i, name: n, order: i }; db.locations.push(l); await store.put("locations", l);
    }
  }
  db.vehicles.sort((a, b) => a.at - b.at);
  db.locations.sort((a, b) => a.order - b.order);
}

/* ---------- helpers ---------- */
let signedInName = "";
const me = () => signedInName || localStorage[LS + "me"] || "";
const PEOPLE = ["Mark", "Chris", "Peter"];
const emailFor = name => name.toLowerCase() + "@keytags.app";
const vehicle = id => db.vehicles.find(v => v.id === id);
const vlabel = v => v ? `${v.name} (${v.vrm})` : "Unknown vehicle";
const keysFor = vid => db.keys.filter(k => k.vehicleId === vid).sort((a, b) => a.n - b.n);
const lastEvent = kid => db.events.filter(e => e.keyId === kid).sort((a, b) => b.at - a.at)[0];
const tagUrl = (vid, kid) => `${PUBLIC_URL}#/v/${vid}/k/${kid}`;
const when = t => new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2500); }
function buzz(ok) { try { navigator.vibrate && navigator.vibrate(ok ? 80 : [60, 60, 60]); } catch {} }

function keyStatus(k) {
  const e = lastEvent(k.id);
  if (!e) return `<span class="pill new">Not scanned yet</span>`;
  return e.action === "in"
    ? `<span class="pill in">On ${esc(e.location)}${e.peg ? " · peg " + e.peg : ""}</span>`
    : `<span class="pill out">With ${esc(holder(e))}</span>`;
}

function holder(e) { return e.action === "handover" ? e.to : e.person; }
function describe(e, what) {
  if (e.action === "bookin") return `<b>${esc(e.person)}</b> booked in ${what}`;
  if (e.action === "handover" && e.taken) return `<b>${esc(e.to)}</b> took ${what} from <b>${esc(e.person)}</b>`;
  if (e.action === "handover") return `<b>${esc(e.person)}</b> handed ${what} to <b>${esc(e.to)}</b>`;
  const where = e.location ? ` ${e.action === "out" ? "from" : "on"} ${esc(e.location)}${e.peg ? " · peg " + e.peg : ""}` : "";
  return `<b>${esc(e.person)}</b> ${e.action === "out" ? "took" : "put"} ${what}${where}`;
}

/* read a tag: its serial + the key id written in its URL (if any) */
function readTag(e) {
  let url = "";
  for (const r of e.message.records) {
    if (r.recordType === "url" || r.recordType === "absolute-url") { try { url = new TextDecoder().decode(r.data); } catch {} }
  }
  const m = url.match(/#\/v\/([^/]+)\/k\/([^/?#]+)/);
  const serial = e.serialNumber || "";
  const key = (m && db.keys.find(k => k.id === m[2])) || (serial && db.keys.find(k => k.serial === serial)) || null;
  const pm = url.match(/#\/peg\/([^/?#]+)/);
  const peg = key ? null : ((pm && db.pegs.find(p => p.id === pm[1])) || (serial && db.pegs.find(p => p.serial === serial)) || null);
  return { serial, url, key, peg, vid: m ? m[1] : null };
}

/* ---------- boards & pegs helpers ---------- */
const boardById = id => db.locations.find(l => l.id === id);
const pegCount = l => l.pegCount || 50;
const pegCols = l => l.cols || 10;
const pegLabel = p => { const l = boardById(p.board); return `${l ? l.name : "Board"} · peg ${p.n}`; };
const pegUrl = id => `${PUBLIC_URL}#/peg/${id}`;
/* where a key is right now: { board, peg } if it's on a board, else null */
function keyPlace(k) { const e = lastEvent(k.id); return e && e.action === "in" ? { board: e.location, peg: e.peg || null } : null; }
/* which key (if any) is hanging on a given board + peg */
function keyOnPeg(boardName, n) { return db.keys.find(k => { const p = keyPlace(k); return p && p.board === boardName && p.peg === n; }) || null; }
async function saveMove(k, action, extra) {
  const prev = keyPlace(k);
  const ev = { id: rid("e_"), keyId: k.id, vehicleId: k.vehicleId, action, location: "", peg: null, to: "", person: extra.person || me() || "Someone", at: Date.now(), ...extra };
  if (action === "out" && prev) { ev.location = prev.board; ev.peg = prev.peg; }
  await store.put("events", ev); db.events.push(ev);
  stampPos(k, action === "in" ? "board" : "held"); ensureTracking();
  return ev;
}

/* who has a key right now (person name), or null if it's on a board / never scanned */
function keyHolder(k) { const e = lastEvent(k.id); return e && e.action !== "in" ? holder(e) : null; }

/* hand-overs wait for the other person to accept */
let seenOffers = new Set();
function renderOffers() {
  const el = $("#offers"); if (!el) return;
  const mine = (db.offers || []).filter(o => o.to === me());
  const fresh = mine.some(o => !seenOffers.has(o.id));
  mine.forEach(o => seenOffers.add(o.id));
  if (fresh) buzz(true);
  el.innerHTML = mine.map(o => {
    const k = db.keys.find(x => x.id === o.keyId), v = k && vehicle(k.vehicleId);
    return `<div class="offer"><b>🤝 ${esc(o.from)}</b> wants to hand you <b>${esc(v?.vrm || "a key")}</b>${k ? ` key ${k.n}` : ""}
      <div class="row"><button class="yes" data-acc="${o.id}">Accept</button><button class="no" data-dec="${o.id}">Decline</button></div></div>`;
  }).join("");
  el.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => answerOffer(b.dataset.acc, true));
  el.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => answerOffer(b.dataset.dec, false));
}
async function answerOffer(id, yes) {
  const o = db.offers.find(x => x.id === id); if (!o) return;
  const k = db.keys.find(x => x.id === o.keyId);
  try {
    await store.del("offers", id); db.offers = db.offers.filter(x => x.id !== id);
    if (yes) {
      if (!k) toast("That key isn't registered any more");
      else if (keyHolder(k) !== o.from) toast(`${o.from} doesn't have that key any more — not handed over`);
      else { await saveMove(k, "handover", { person: o.from, to: me() }); toast(`✓ You now have ${vehicle(k.vehicleId)?.vrm || "the key"} key ${k.n}`); }
    } else toast("Declined");
  } catch (err) { toast("Couldn't save: " + err.message); }
  renderOffers();
  if (!session) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}

/* one active NFC session at a time */
let session = null, idleCtrl = null, pegWaiter = null, tapHandler = null;
function stopIdle() { if (idleCtrl) { idleCtrl.abort(); idleCtrl = null; } }
function stopSession() { if (session) { session.abort(); session = null; } stopIdle(); }

/* once NFC has been allowed, pages can start listening without a Start tap */
async function nfcAllowed() {
  if (!NFC) return false;
  try { return (await navigator.permissions.query({ name: "nfc" })).state === "granted"; } catch { return false; }
}
/* on ordinary pages: tapping a key opens its vehicle, tapping a peg shows the peg (inside the app, no new tab) */
async function startIdle(force) {
  stopIdle();
  if (!force && !(await nfcAllowed())) return;
  const ctrl = new AbortController(); idleCtrl = ctrl;
  const reader = new NDEFReader();
  try { await reader.scan({ signal: ctrl.signal }); } catch { if (idleCtrl === ctrl) idleCtrl = null; return; }
  let last = 0;
  reader.onreading = e => {
    if (idleCtrl !== ctrl || Date.now() - last < 2500) return;
    last = Date.now();
    const t = readTag(e);
    if (t.peg && pegWaiter) { buzz(true); pegWaiter(t.peg).catch(err => toast("Couldn't save: " + err.message)); return; }
    if (tapHandler) { buzz(true); tapHandler(t); return; }
    if (t.key) { buzz(true); location.hash = `#/v/${t.key.vehicleId}/k/${t.key.id}`; }
    else if (t.peg) { buzz(true); location.hash = `#/peg/${t.peg.id}`; }
    else toast("That sticker isn't registered");
  };
}

/* ---------- views ---------- */
function setNav(name) { document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === name)); }
function renderWho() {
  const w = $("#who");
  w.textContent = me() ? `👤 ${me()}` : "Set your name";
  w.style.display = (sb && !signedInName) ? "none" : "";
}
$("#who").onclick = async () => {
  if (sb) {
    if (signedInName && confirm(`Signed in as ${signedInName}. Sign out?`)) { stopSession(); await sb.auth.signOut(); location.reload(); }
    return;
  }
  const n = prompt("Your name (shown when you scan keys in/out):", me()); if (n !== null) { localStorage[LS + "me"] = n.trim(); renderWho(); }
};

/* ---------- sign in (shared mode) ---------- */
function viewLogin(msg) {
  setNav("");
  document.querySelector("nav").style.display = "none";
  let pick = localStorage[LS + "lastUser"] || PEOPLE[0];
  $("#app").innerHTML = `
    <h1>Sign in</h1>
    <form class="card" id="login">
      <h2 style="margin-top:0">Who are you?</h2>
      <div class="seg" id="people">${PEOPLE.map(p => `<button type="button" data-p="${p}" class="${p === pick ? "on" : ""}">${p}</button>`).join("")}</div>
      <h2>Password</h2>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary big" style="margin-top:16px" id="go">Sign in</button>
      ${msg ? `<div class="notice" style="margin:12px 0 0">${esc(msg)}</div>` : ""}
    </form>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    pick = b.dataset.p; document.querySelectorAll("[data-p]").forEach(x => x.classList.toggle("on", x === b));
  });
  $("#login").onsubmit = async ev => {
    ev.preventDefault();
    $("#go").disabled = true; $("#go").textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: emailFor(pick), password: $("#pw").value });
    if (error) { viewLogin("Wrong password — try again."); return; }
    localStorage[LS + "lastUser"] = pick;
    start();
  };
}

/* ---------- live updates ---------- */
let liveTimer = null, liveChannel = null;
function goLive() {
  if (!sb || liveChannel) return;
  liveChannel = sb.channel("items-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "items" }, payload => {
      if (payload.new && payload.new.kind === "pos") {
        upsertPos({ id: payload.new.id, ...payload.new.data });
        if (currentView === "map") updateMap();
        return;
      }
      clearTimeout(liveTimer);
      liveTimer = setTimeout(refresh, 400);
    })
    .subscribe();
}
async function refresh() {
  try { await load(); } catch { return; }
  renderOffers();
  // don't redraw mid-scan or while someone is typing; the data is still updated underneath
  const typing = document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName);
  if (session || typing || pegWaiter || document.querySelector("#reg .panel")) return;
  ensureTracking();
  if (currentView === "map") { updateMap(); return; }   // updates in place, search box keeps focus
  const keep = homeShown;
  const y = window.scrollY; render(); window.scrollTo(0, y);
  if (keep && (location.hash === "" || location.hash === "#/")) { const kk = db.keys.find(x => x.id === keep); if (kk) showKeyExternal(kk); }
}

/* ---------- live location: one row per key, overwritten every 10 s ---------- */
let fix = null, watchId = null, pingTimer = null, trackErr = "";
const upsertPos = r => { const i = db.pos.findIndex(x => x.id === r.id); if (i >= 0) db.pos[i] = r; else db.pos.push(r); };
const posFor = kid => db.pos.find(p => p.id === "pos_" + kid);
function myHeldKeys() {
  if (!me()) return [];
  return db.keys.filter(k => { const e = lastEvent(k.id); return e && e.action !== "in" && holder(e) === me(); });
}
function ensureTracking() {
  const held = myHeldKeys();
  if (held.length && watchId === null && "geolocation" in navigator) {
    watchId = navigator.geolocation.watchPosition(
      p => { fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() }; trackErr = ""; renderTracking(); },
      err => { trackErr = err.code === 1 ? "Location is blocked — allow it for this site so others can see where the keys are" : "Waiting for location…"; renderTracking(); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  }
  if (!held.length && watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  keepAwake(held.length > 0);
  if (!pingTimer) pingTimer = setInterval(ping, 10000);
  renderTracking();
}
/* keep the screen on while holding keys, so the page keeps pinging */
let wakeLock = null, wantAwake = false;
async function keepAwake(on) {
  wantAwake = on;
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; renderTracking(); });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
  renderTracking();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wantAwake) keepAwake(true); });

function renderTracking() {
  const el = $("#track"), n = myHeldKeys().length;
  el.classList.toggle("on", n > 0);
  el.textContent = !n ? "" : trackErr ? "📍 " + trackErr
    : `📍 Sharing your location for ${n} key${n === 1 ? "" : "s"}${wakeLock ? " — screen kept on, leave this app open" : " — keep this app open"}`;
}
let lastPing = 0;
async function ping() {
  const held = myHeldKeys();
  if (!held.length || !fix) return;
  const now = Date.now();
  if (now - lastPing < 9000) return;
  lastPing = now;
  const rows = held.map(k => ({ id: "pos_" + k.id, keyId: k.id, lat: fix.lat, lng: fix.lng, acc: fix.acc, at: now, by: me(), state: "held" }));
  try { await store.putMany("pos", rows); rows.forEach(upsertPos); if (currentView === "map") updateMap(); } catch {}
}

/* stamp a key's location the moment it's scanned (first ping, or its final spot on a board) */
function stampPos(k, state) {
  const write = async f => {
    const r = { id: "pos_" + k.id, keyId: k.id, lat: f.lat, lng: f.lng, acc: f.acc, at: Date.now(), by: me(), state };
    try { await store.put("pos", r); upsertPos(r); } catch {}
  };
  if (fix && Date.now() - fix.at < 60000) { write(fix); return; }
  if (!("geolocation" in navigator)) return;
  navigator.geolocation.getCurrentPosition(
    p => { fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() }; write(fix); },
    () => {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
}

/* ---------- where are the keys: boards as peg grids, people, and reg search ---------- */

/* ---------- register keys ---------- */
function registerPanel(host, v) {
  stopSession();
  let count = 3;
  host.innerHTML = `<div class="panel">
    <div style="font-weight:700">Register keys for ${esc(vlabel(v))}</div>
    <p class="muted" style="margin:6px 0 12px">How many key tags?</p>

  </div>`;
  host.scrollIntoView({ behavior: "smooth", block: "nearest" });
  $("#m").onclick = () => { count = Math.max(1, count - 1); $("#c").textContent = count; };
  $("#p").onclick = () => { count = Math.min(10, count + 1); $("#c").textContent = count; };
  $("#x").onclick = () => { host.innerHTML = ""; };
  $("#go").onclick = () => runRegister(host, v, count);

async function runRegister(host, v, count) {
  let done = 0, busy = false;
  const recent = new Map();
  host.innerHTML = `<div class="panel">
    <div class="row"><div class="grow" style="font-weight:700">Tap each tag on the back of your phone</div>
      <button id="stop">Done</button></div>
    <div style="margin-top:10px"><span class="big-count" id="n">0</span> <span class="muted">of ${count} registered</span></div>
    <div class="dots">${Array.from({ length: count }, () => "<span></span>").join("")}</div>
    <ul class="log" id="log"></ul></div>`;
  const log = (msg, cls) => { $("#log").insertAdjacentHTML("afterbegin", `<li class="${cls}">${esc(msg)}</li>`); buzz(cls === "good"); };
  const finish = () => {
    stopSession();
    const btn = $("#stop"); if (btn) { btn.textContent = "Close"; btn.onclick = () => route(); }
    log(done >= count ? `All ${count} of ${count} registered ✓` : `${done} of ${count} registered`, done >= count ? "good" : "warn");
  };
  $("#stop").onclick = finish;

  const ctrl = new AbortController(); session = ctrl;
  const reader = new NDEFReader();
  try { await reader.scan({ signal: ctrl.signal }); }
  catch (e) { log("Couldn't start NFC: " + e.message + " — is NFC switched on?", "bad"); return; }

  reader.onreadingerror = () => log("Couldn't read that tag — try again", "bad");
  reader.onreading = async e => {
    const t = readTag(e);
    const tagKey = t.serial || t.url;
    if (busy || (tagKey && Date.now() - (recent.get(tagKey) || 0) < 3000)) return;   // ignore the same tag bouncing
    busy = true; recent.set(tagKey, Date.now());
    try {
      if (t.key && t.key.vehicleId === v.id) log(`Already registered as key ${t.key.n} — skipped`, "warn");
      else if (t.key) log(`Belongs to ${vlabel(vehicle(t.key.vehicleId))} — not registered. Release it there first.`, "bad");
      else if (t.peg) log(`That's a peg sticker (${pegLabel(t.peg)}) — use a different sticker for keys`, "bad");
      else {
        const k = { id: rid("k_"), serial: t.serial, vehicleId: v.id, n: (keysFor(v.id).at(-1)?.n || 0) + 1, at: Date.now() };
        await reader.write({ records: [{ recordType: "url", data: tagUrl(v.id, k.id) }] }, { signal: ctrl.signal });
        await store.put("keys", k); db.keys.push(k);
        const be = { id: rid("e_"), keyId: k.id, vehicleId: v.id, action: "bookin", location: "", to: "", person: me() || "Someone", at: Date.now() };
        await store.put("events", be); db.events.push(be);
        stampPos(k, "held"); ensureTracking();
        done++;
        $("#n").textContent = done;
        document.querySelectorAll(".dots span").forEach((s, i) => s.classList.toggle("on", i < done));
        log(`Key ${k.n} registered`, "good");
        if (done >= count) finish();
      }
    } catch (err) {
      if (err.name !== "AbortError") log("Not registered — hold the tag still and try again", "bad");
      recent.delete(tagKey);
    } finally { setTimeout(() => busy = false, 800); }
  };
}

function bindKeyActions(scope, again) {
  scope.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const k = db.keys.find(x => x.id === b.dataset.k); if (!k) return;
    const act = b.dataset.act;
    try {
      if (act === "take") {
        const who = keyHolder(k);
        const ev = who && who !== me()
          ? await saveMove(k, "handover", { person: who, to: me(), taken: true })
          : await saveMove(k, "out", { person: me() });
        toast("✓ " + describe(ev, "key " + k.n).replace(/<[^>]+>/g, ""));
        again(); return;
      }
      const box = scope.querySelector("#qa_" + k.id);
      if (act === "puton") {
        const manual = () => {
          box.innerHTML = `<div class="muted" style="margin-top:10px">Which board?</div>
            <div class="chips" style="margin-top:6px">${db.locations.map(l => `<button data-board="${l.id}">${esc(l.name)}</button>`).join("")}</div>`;
          box.querySelectorAll("[data-board]").forEach(c => c.onclick = async () => {
            const l = boardById(c.dataset.board); pegWaiter = null;
            await saveMove(k, "in", { location: l.name, peg: null, person: me() });
            toast(`✓ Key ${k.n} on ${l.name}`); again();
          });
        };
        if (!NFC) { manual(); return; }
        pegWaiter = async peg => {
          pegWaiter = null;
          const l = boardById(peg.board);
          await saveMove(k, "in", { location: l ? l.name : "Board", peg: peg.n, person: me() });
          toast(`✓ Key ${k.n} on ${pegLabel(peg)}`); again();
        };
        if (!idleCtrl) await startIdle(true);
        b.style.display = "none";
        box.innerHTML = `<div class="listen" style="margin-top:10px"><div class="dot"></div><div class="grow">Now tap the peg you're hanging it on</div>
            <button class="danger" id="cancelpeg" style="color:var(--muted)">Cancel</button></div>
          <a href="javascript:void 0" id="nopeg" class="muted" style="display:block;margin-top:8px;font-size:14px">No sticker on the peg?</a>`;
        $("#cancelpeg").onclick = () => { pegWaiter = null; again(); };
        $("#nopeg").onclick = manual;
      }
      if (act === "unreg") {
        b.outerHTML = `<div class="row" style="margin-top:8px;gap:8px"><button class="grow" style="background:var(--bad);color:#fff" data-yes="${k.id}">Yes, unregister sticker</button><button data-no="1">Cancel</button></div>`;
        scope.querySelector("[data-no]").onclick = () => again();
        scope.querySelector("[data-yes]").onclick = async () => {
          try {
            await store.del("keys", k.id); db.keys = db.keys.filter(x => x.id !== k.id);
            await store.del("pos", "pos_" + k.id).catch(() => {}); db.pos = db.pos.filter(x => x.id !== "pos_" + k.id);
            await store.del("offers", "o_" + k.id).catch(() => {}); db.offers = db.offers.filter(x => x.id !== "o_" + k.id);
          } catch (err) { toast("Couldn't unregister: " + err.message); return; }
          ensureTracking(); toast("✓ Sticker unregistered — it can be used again"); again(true);
        };
        return;
      }
      if (act === "give") {
        const o = { id: "o_" + k.id, keyId: k.id, from: me(), to: b.dataset.to, at: Date.now() };
        await store.put("offers", o); db.offers = db.offers.filter(x => x.id !== o.id).concat(o);
        toast(`Sent — ${o.to} gets an Accept button`); again();
      }
    } catch (err) { toast("Couldn't save: " + err.message); }
  });
}

      return `<a class="vlink card row" href="#/v/${k.vehicleId}/k/${k.id}"><span class="plate">${esc(v?.vrm || "?")}</span><span class="grow">${esc(v?.name || "")}</span><span class="muted">Key ${k.n}</span></a>`; }).join("")}` : ""}`;

  const scanbox = async () => {
    if (!NFC) { $("#scanbox").innerHTML = ""; return; }
    const on = !!idleCtrl;
    $("#scanbox").innerHTML = on
      ? `<div class="listen" style="font-size:18px"><div class="dot"></div><div>Tap a key or a peg</div></div>`

    if (!on) $("#scanon").onclick = async () => { await startIdle(true); scanbox(); };
  };
  // idle listening may still be starting up
  scanbox(); setTimeout(scanbox, 600);

  const keyCard = k => {
    const v = vehicle(k.vehicleId);
    return `<div class="card" style="border:2px solid var(--accent)">
      <div class="row"><span class="plate" style="font-size:20px">${esc(v?.vrm || "?")}</span>
        <div class="grow"><b>${esc(v?.name || "")}</b> · key ${k.n}</div>
        <a href="#/v/${k.vehicleId}" style="font-size:14px">Vehicle</a></div>
      <div style="margin-top:8px">${keyStatus(k)}</div>
      ${keyActions(k)}

  };
  let shown = null;
  const showKey = (k, keep) => {
    shown = k ? k.id : null; homeShown = shown;
    if (!k) { $("#tapped").innerHTML = ""; return; }
    $("#tapped").innerHTML = keyCard(k);
    bindKeyActions($("#tapped"), gone => { if (!$("#tapped")) return; const kk = !gone && db.keys.find(x => x.id === shown); kk ? showKey(kk) : showKey(null); renderMine(); });
  };
  const renderMine = () => { if (location.hash === "" || location.hash === "#/") { const y = window.scrollY; const keep = shown; viewActions(); if (keep) { const kk = db.keys.find(x => x.id === keep); if (kk) showKeyExternal(kk); } window.scrollTo(0, y); } };
  showKeyExternal = showKey;
  const showPeg = peg => {
    const l = boardById(peg.board), k = l && keyOnPeg(l.name, peg.n), v = k && vehicle(k.vehicleId);
    $("#tapped").innerHTML = `<div class="card result" style="border:2px solid var(--accent)">
      <div class="found">🗂 ${esc(pegLabel(peg))}</div>
      <div style="margin-top:8px">${k ? `Holds <a href="#/v/${k.vehicleId}/k/${k.id}"><span class="plate">${esc(v?.vrm || "?")}</span> key ${k.n}</a>` : `<span class="muted">Empty</span>`}</div>
      <button class="danger" style="margin-top:8px;font-size:13px;color:var(--muted)" id="unpeg">Unregister peg sticker</button></div>`;
    $("#unpeg").onclick = async () => {
      if (!confirm(`Unregister the sticker on ${pegLabel(peg)}?`)) return;
      await store.del("pegs", peg.id).catch(err => toast(err.message)); db.pegs = db.pegs.filter(x => x.id !== peg.id);
      toast("✓ Peg sticker unregistered"); $("#tapped").innerHTML = "";
    };
  };
  tapHandler = t => {
    if (t.key) showKey(t.key);
    else if (t.peg) showPeg(t.peg);
    else { $("#tapped").innerHTML = `<div class="card muted">That sticker isn't registered. Use <b>Book in a vehicle</b> to register key stickers, or <b>Keys → Set up pegs</b> for peg stickers.</div>`; }
    window.scrollTo(0, 0);
  };

  const showResults = () => {
    const q = $("#hq").value, ks = matchingKeys(q);
    $("#hresults").innerHTML = !normReg(q) ? "" : ks.length ? ks.map(k => { const v = vehicle(k.vehicleId);
      return `<a class="vlink card row" href="#/v/${k.vehicleId}/k/${k.id}" style="margin-top:8px"><span class="plate">${esc(v.vrm)}</span>
        <span class="grow">Key ${k.n}</span><span class="found">${esc(whereText(k))}</span></a>`; }).join("")
      : `<div class="muted" style="margin-top:8px">No keys match "${esc(q)}"</div>`;
  };
  $("#hq").oninput = showResults;
}

/* ---------- put on board / take from board / hand over / check ---------- */
async function startReader(onTag) {
  stopSession();
  const ctrl = new AbortController(); session = ctrl;
  const reader = new NDEFReader();
  await reader.scan({ signal: ctrl.signal });
  const recent = new Map();
  reader.onreadingerror = () => onTag(null);
  reader.onreading = e => {
    const t = readTag(e), tk = t.serial || t.url;
    if (tk && Date.now() - (recent.get(tk) || 0) < 3000) return;   // same tag bouncing
    recent.set(tk, Date.now());
    onTag(t);
  };
}

const JOBS = {
  station:  { title: "Board station",          ask: "Who's scanning?",              tap: "Tap a key, then the peg to hang it on — or tap a key to take it" },
  in:       { title: "Put keys on a board",    ask: "",                             tap: "Tap the key, then the peg you hang it on" },
  out:      { title: "Take keys from a board", ask: "",                             tap: "Tap each key you take" },
  handover: { title: "Hand keys over",         ask: "Who are you giving them to?",  tap: "Tap each key you're handing over" },
  check:    { title: "Check a key or peg",     ask: "",                             tap: "Tap a key or a peg" },
  unregister: { title: "Unregister a sticker", ask: "",                             tap: "Tap the sticker on your phone" },
};

function viewDo(mode) {
  const job = JOBS[mode];
  if (!job) { viewActions(); return; }
  setNav("home");
  let choice = mode === "station" ? (me() || null) : null, paused = false, pendingKey = null, pendingTimer = null, boardFallback = null;
  const pick = mode === "handover" || mode === "station";
  const opts = mode === "handover" ? PEOPLE.filter(p => p !== me()) : PEOPLE;
  const myOffers = () => db.offers.filter(o => o.from === me());
  $("#app").innerHTML = `${backHome}
    <h1 style="margin-top:10px">${job.title}</h1>
    ${nfcNotice()}
    ${mode === "station" ? `<p class="muted" style="margin-top:-6px">Leave this open on a phone at the key board, or use it on your own phone. It stays awake and keeps listening.</p>` : ""}
    ${mode === "handover" ? `<p class="muted" style="margin-top:-6px">They get an Accept button. The keys stay with you until they accept.</p>` : ""}
    ${pick ? `
      <div class="step"><i>1</i>${job.ask}</div>
      <div class="chips big">${opts.map(o => `<button data-c="${esc(o)}" class="${o === choice ? "on" : ""}">${esc(o)}</button>`).join("")}</div>
      <div class="step ${choice ? "" : "dim"}" id="s2"><i>2</i>${job.tap}</div>
      ${mode === "station" && choice ? `<button class="primary big" id="startcheck">Start</button>` : ""}` : `
      <button class="primary big" id="startcheck" style="margin-top:6px">Start</button>`}
    ${mode === "in" ? `<details style="margin-top:12px"><summary class="muted">No peg stickers on this board yet?</summary>
      <div class="muted" style="margin:8px 0">Pick the board and just tap keys. They'll show as "peg unknown".</div>
      <div class="chips">${db.locations.map(l => `<button data-b="${esc(l.name)}">${esc(l.name)}</button>`).join("")}</div></details>` : ""}
    <div id="live"></div>
    <ul class="log" id="log"></ul>
    ${mode === "handover" ? `<div id="waiting"></div>` : ""}
    <button class="big" id="done" style="display:none;margin-top:10px">Done</button>`;

  const log = (html, cls) => { $("#log").insertAdjacentHTML("afterbegin", `<li class="${cls}">${html}</li>`); buzz(cls === "good"); };
  const ready = (extra = "") => { $("#live").innerHTML = `<div class="listen"><div class="dot"></div><div>${extra || "Ready — " + job.tap.toLowerCase()}</div></div>`; };
  const kname = k => `${esc(vlabel(vehicle(k.vehicleId)))} key ${k.n}`;
  const showWaiting = () => {
    if (!$("#waiting")) return;
    const ws = myOffers();
    $("#waiting").innerHTML = ws.length ? `<h2>Waiting to be accepted</h2>${ws.map(o => { const k = db.keys.find(x => x.id === o.keyId);
      return `<div class="card row"><span class="grow">${k ? kname(k) : "Key"} → <b>${esc(o.to)}</b></span><button class="danger" data-cancel="${o.id}">Cancel</button></div>`; }).join("")}` : "";
    document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
      await store.del("offers", b.dataset.cancel).catch(() => {}); db.offers = db.offers.filter(o => o.id !== b.dataset.cancel); showWaiting();
    });
  };
  showWaiting();
  $("#done").onclick = () => { stopSession(); keepAwake(false); location.hash = "#/"; };
  nfcAllowed().then(ok => { if (ok && location.hash.startsWith("#/do/" + mode) && !session) go(); });

  const go = async () => {
    if (!NFC) { toast("Needs Chrome on an Android phone"); return; }
    try { await startReader(t => handle(t)); }
    catch (e) { log("Couldn't start NFC: " + esc(e.message) + " — is NFC switched on?", "bad"); return; }
    if ($("#s2")) $("#s2").classList.remove("dim");
    if ($("#startcheck")) $("#startcheck").style.display = "none";
    if (mode === "station") keepAwake(true);
    ready(); $("#done").style.display = "";
  };
  const waitForPeg = k => {
    pendingKey = k; clearTimeout(pendingTimer);
    ready(`<b>${kname(k)}</b><br>Now tap the peg you're hanging it on`);
    pendingTimer = setTimeout(() => { pendingKey = null; ready(); }, 45000);
  };
  const putOn = async (k, peg) => {
    const l = boardById(peg.board), boardName = l ? l.name : "Board";
    const occupant = keyOnPeg(boardName, peg.n);
    const ev = await saveMove(k, "in", { location: boardName, peg: peg.n, person: choice || me() });
    log("✓ " + describe(ev, kname(k)), "good");
    if (occupant && occupant.id !== k.id) log(`Heads up: ${kname(occupant)} was also logged on that peg`, "warn");
    pendingKey = null; clearTimeout(pendingTimer); ready();
  };
  const pegInfo = peg => {
    const l = boardById(peg.board), k = l && keyOnPeg(l.name, peg.n);
    $("#live").innerHTML = `<div class="card result"><div class="found">🗂 ${esc(pegLabel(peg))}</div>
      <div style="margin-top:8px">${k ? `Holds <span class="plate">${esc(vehicle(k.vehicleId)?.vrm || "?")}</span> key ${k.n}` : `<span class="muted">Empty</span>`}</div></div>`;
    buzz(true);
  };

  const handle = async t => {
    if (paused) return;
    if (!t) { log("Couldn't read that — try again", "bad"); return; }
    try {
      if (mode === "unregister") {
        if (t.key) { paused = true; $("#log").innerHTML = ""; unregisterCard(t.key, vehicle(t.key.vehicleId)); buzz(true); return; }
        if (t.peg) { paused = true; $("#log").innerHTML = ""; unregisterPegCard(t.peg); buzz(true); return; }
        log("That sticker isn't registered to anything — it's free to use", "warn"); return;
      }
      if (mode === "check") {
        if (t.peg) { pegInfo(t.peg); return; }
        if (!t.key) { log("That sticker isn't registered", "bad"); return; }
        const k = t.key, v = vehicle(k.vehicleId);
        const hist = db.events.filter(e => e.keyId === k.id).sort((a, b) => b.at - a.at).slice(0, 3);
        $("#log").innerHTML = "";
        $("#live").innerHTML = `<div class="card result">
            <div class="plate">${esc(v?.vrm || "?")}</div>
            <div style="font-size:20px;font-weight:700;margin-top:10px">${esc(v?.name || "Unknown vehicle")}</div>
            <div class="muted">Key ${k.n} of ${keysFor(k.vehicleId).length}</div>
            <div style="margin:12px 0">${keyStatus(k)}</div>
            ${hist.length ? `<div class="muted" style="font-size:14px">${hist.map(e => describe(e, "it") + " · " + when(e.at)).join("<br>")}</div>` : ""}
            <a href="#/v/${k.vehicleId}" style="display:block;margin-top:14px"><button class="primary big">Open vehicle</button></a>
            <div class="muted" style="margin-top:10px">Tap another key or peg to check it</div>
          </div>`;
        buzz(true); return;
      }
      if (t.peg) {
        if ((mode === "in" || mode === "station") && pendingKey) { await putOn(pendingKey, t.peg); return; }
        if (mode === "in") { log("Tap the key first, then the peg", "warn"); return; }
        pegInfo(t.peg); return;
      }
      if (!t.key) { log("That sticker isn't registered to a vehicle", "bad"); return; }
      const k = t.key, who = keyHolder(k), place = keyPlace(k);

      if (mode === "handover") {
        if (!choice) { log("Pick who you're handing to first", "warn"); return; }
        if (who !== me()) {
          log(place ? `${kname(k)} is on ${esc(place.board)}${place.peg ? " · peg " + place.peg : ""} — take it from the board first`
                    : who ? `${kname(k)} is with ${esc(who)}, not you — only they can hand it over` : `${kname(k)} hasn't been booked out to you`, "bad");
          return;
        }
        const o = { id: "o_" + k.id, keyId: k.id, from: me(), to: choice, at: Date.now() };   // one offer per key; a new one replaces the old
        await store.put("offers", o); db.offers = db.offers.filter(x => x.id !== o.id).concat(o);
        log(`Sent — waiting for <b>${esc(choice)}</b> to accept ${kname(k)}`, "good"); showWaiting(); return;
      }
      if (mode === "out" || (mode === "station" && place)) {
        if (!place) { log(`${kname(k)} isn't on a board${who ? ` — it's with ${esc(who)}` : ""}`, "bad"); return; }
        const ev = await saveMove(k, "out", { person: choice || me() }); log("✓ " + describe(ev, kname(k)), "good"); return;
      }
      if (mode === "in" && boardFallback) { const ev = await saveMove(k, "in", { location: boardFallback }); log("✓ " + describe(ev, kname(k)) + " (peg unknown)", "good"); return; }
      if (pendingKey && pendingKey.id === k.id) { pendingKey = null; clearTimeout(pendingTimer); ready(); log("Cancelled", "warn"); return; }
      waitForPeg(k); buzz(true);
    } catch (err) { log("Couldn't save: " + esc(err.message), "bad"); }
  };

  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    choice = b.dataset.c;
    document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b));
    if ($("#s2")) $("#s2").classList.remove("dim");
    if (session) { if ($("#startcheck")) $("#startcheck").style.display = "none"; ready(); } else go();
  });
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
    boardFallback = b.dataset.b;
    document.querySelectorAll("[data-b]").forEach(x => x.classList.toggle("on", x === b));
    if (!session) go();
  });
  if ($("#startcheck")) $("#startcheck").onclick = go;

  /* unregister: confirm, release, done */
  const unregistered = msg => {
    $("#live").innerHTML = `<div class="card result"><div style="font-size:20px;font-weight:700">✓ Unregistered</div>
      <div class="muted" style="margin:6px 0 14px">${msg}</div>
      <button class="primary big" id="another">Unregister another</button></div>`;
    $("#another").onclick = () => { paused = false; go(); };
  };
  function unregisterCard(k, v) {
    $("#live").innerHTML = `<div class="card result">
        <div class="plate">${esc(v?.vrm || "?")}</div>
        <div style="font-size:20px;font-weight:700;margin-top:10px">${esc(v?.name || "Unknown vehicle")} · key ${k.n}</div>
        <div style="margin:10px 0">${keyStatus(k)}</div>
        <button class="primary big" id="unreg" style="background:var(--bad)">Unregister this sticker</button>
        <button class="big" id="unregno" style="margin-top:8px">Cancel</button>
      </div>`;
    $("#unregno").onclick = () => { paused = false; ready(); };
    $("#unreg").onclick = async () => {
      try {
        await store.del("keys", k.id); db.keys = db.keys.filter(x => x.id !== k.id);
        try { await store.del("pos", "pos_" + k.id); db.pos = db.pos.filter(x => x.id !== "pos_" + k.id); } catch {}
        try { await store.del("offers", "o_" + k.id); db.offers = db.offers.filter(x => x.id !== "o_" + k.id); } catch {}
      } catch (err) { toast("Couldn't unregister: " + err.message); return; }
      ensureTracking();
      unregistered(`${esc(v?.vrm || "")} key ${k.n} is no longer linked. The sticker can be used again.`);
    };
  }
  function unregisterPegCard(peg) {
    $("#live").innerHTML = `<div class="card result">
        <div class="found">🗂 ${esc(pegLabel(peg))}</div>
        <button class="primary big" id="unreg" style="background:var(--bad);margin-top:12px">Unregister this peg sticker</button>
        <button class="big" id="unregno" style="margin-top:8px">Cancel</button>
      </div>`;
    $("#unregno").onclick = () => { paused = false; ready(); };
    $("#unreg").onclick = async () => {
      try { await store.del("pegs", peg.id); db.pegs = db.pegs.filter(x => x.id !== peg.id); }
      catch (err) { toast("Couldn't unregister: " + err.message); return; }
      unregistered(`${esc(pegLabel(peg))} no longer has a sticker. The sticker can be used again.`);
    };
  }
}

/* ---------- set up a board's peg stickers ---------- */
function viewPegSetup(lid) {
  const l = boardById(lid);
  if (!l) { location.hash = "#/keys"; return; }
  setNav("keys");
  const mine = () => db.pegs.filter(p => p.board === lid);
  const nextN = () => { const used = new Set(mine().map(p => p.n)); let n = 1; while (used.has(n)) n++; return n; };
  $("#app").innerHTML = `<a href="#/keys" class="muted" style="text-decoration:none">← Where are the keys</a>
    <h1 style="margin-top:10px">Set up pegs · ${esc(l.name)}</h1>
    ${nfcNotice()}
    <div class="card">
      <div class="row"><label class="grow">Pegs on this board</label><input id="pc" type="number" min="1" max="2000" value="${pegCount(l)}" style="width:100px"></div>
      <div class="row" style="margin-top:8px"><label class="grow">Pegs across (per row)</label><input id="cols" type="number" min="1" max="40" value="${pegCols(l)}" style="width:100px"></div>
      <div class="row" style="margin-top:8px"><label class="grow">Board name</label><input id="bn" value="${esc(l.name)}" style="width:160px"></div>
      <button class="big" id="savelayout" style="margin-top:10px">Save layout</button>
    </div>
    <div class="card"><b>${mine().length}</b> of ${pegCount(l)} pegs have a sticker.</div>
    <div class="step"><i>1</i>Start numbering at</div>
    <div class="row"><input id="startn" type="number" min="1" value="${nextN()}" style="width:110px;font-size:20px;font-weight:700"><button class="primary grow big" id="go">Start tapping pegs</button></div>
    <div class="step dim" id="s2"><i>2</i>Tap the peg stickers in order — peg <span id="cur">${nextN()}</span> next</div>
    <ul class="log" id="log"></ul>`;
  const log = (msg, cls) => { $("#log").insertAdjacentHTML("afterbegin", `<li class="${cls}">${esc(msg)}</li>`); buzz(cls === "good"); };
  $("#savelayout").onclick = async () => {
    l.pegCount = Math.max(1, +$("#pc").value || 50); l.cols = Math.max(1, +$("#cols").value || 10);
    l.name = $("#bn").value.trim() || l.name;
    try { await store.put("locations", l); toast("Saved"); } catch (e) { toast("Couldn't save: " + e.message); return; }
    viewPegSetup(lid);
  };
  $("#go").onclick = async () => {
    if (!NFC) { toast("Needs Chrome on an Android phone"); return; }
    let n = Math.max(1, +$("#startn").value || 1), busy = false;
    const recent = new Map();
    stopSession();
    const ctrl = new AbortController(); session = ctrl;
    const reader = new NDEFReader();
    try { await reader.scan({ signal: ctrl.signal }); } catch (e) { log("Couldn't start NFC: " + e.message, "bad"); return; }
    $("#s2").classList.remove("dim"); $("#go").textContent = "Listening…"; $("#go").disabled = true;
    keepAwake(true);
    reader.onreading = async e => {
      const t = readTag(e), tk = t.serial || t.url;
      if (busy || (tk && Date.now() - (recent.get(tk) || 0) < 3000)) return;
      busy = true; recent.set(tk, Date.now());
      try {
        if (t.key) { log(`That's a key sticker (${vlabel(vehicle(t.key.vehicleId))} key ${t.key.n}) — skipped`, "bad"); return; }
        if (t.peg) { log(`Already ${pegLabel(t.peg)} — skipped`, "warn"); return; }
        while (mine().some(p => p.n === n)) n++;
        const peg = { id: rid("p_"), serial: t.serial, board: lid, n, at: Date.now() };
        await reader.write({ records: [{ recordType: "url", data: pegUrl(peg.id) }] }, { signal: ctrl.signal });
        await store.put("pegs", peg); db.pegs.push(peg);
        if (n > pegCount(l)) { l.pegCount = n; store.put("locations", l).catch(() => {}); }
        log(`Peg ${n} registered`, "good");
        n++; $("#cur").textContent = n;
      } catch (err) { if (err.name !== "AbortError") log("Didn't register — hold it still and try again", "bad"); recent.delete(tk); }
      finally { setTimeout(() => busy = false, 700); }
    };
  };
}

/* ---------- tapping a peg sticker opens this ---------- */
function viewPeg(id) {
  setNav("keys");
  const peg = db.pegs.find(p => p.id === id);
  if (!peg) { $("#app").innerHTML = `<div class="empty">This peg sticker isn't registered any more.<br><br><a href="#/keys">Where are the keys</a></div>`; return; }
  const l = boardById(peg.board), k = l && keyOnPeg(l.name, peg.n), v = k && vehicle(k.vehicleId);
  $("#app").innerHTML = `<a href="#/keys" class="muted" style="text-decoration:none">← Where are the keys</a>
    <div class="card result" style="margin-top:12px"><div class="found" style="font-size:22px">🗂 ${esc(pegLabel(peg))}</div>
      <div style="margin-top:12px">${k ? `<span class="plate" style="font-size:22px">${esc(v?.vrm || "?")}</span><div style="margin-top:6px">${esc(v?.name || "")} · key ${k.n}</div>
        <a href="#/v/${k.vehicleId}" style="display:block;margin-top:12px"><button class="primary big">Open vehicle</button></a>` : `<span class="muted">Nothing on this peg</span>`}</div></div>`;
}

/* ---------- map: where each person / board's keys are ---------- */
let map = null, mapLayer = null, mapFitted = false, leafletLoading = null, mapQuery = "";
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletLoading) return leafletLoading;
  leafletLoading = new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload = res; js.onerror = rej; document.head.appendChild(js);
  });
  return leafletLoading;
}
function mapGroups() {
  const groups = new Map();
  for (const k of (normReg(mapQuery) ? matchingKeys(mapQuery) : db.keys)) {
    const e = lastEvent(k.id), p = posFor(k.id);
    if (!e || !p) continue;
    const onBoard = e.action === "in";
    const gid = onBoard ? "b:" + e.location : "p:" + holder(e);
    if (!groups.has(gid)) groups.set(gid, { name: onBoard ? e.location : holder(e), onBoard, keys: [], pos: p });
    const g = groups.get(gid); g.keys.push(k);
    if (p.at > g.pos.at) g.pos = p;
  }
  return [...groups.values()];
}
/* Plus Codes (Open Location Code): free, no key, worked out on the phone. 11 digits = a ~3 m x 3.5 m square. */
const OLC = "23456789CFGHJMPQRVWX";
function plusCode(lat, lng) {
  lat = Math.min(90 - 1e-9, Math.max(-90, lat));
  lng = ((lng + 180) % 360 + 360) % 360 - 180;
  let la = Math.floor((lat + 90) * 40000), lo = Math.floor((lng + 180) * 32000);   // 8000 per degree x grid 5 rows / 4 cols
  const south = la / 40000 - 90, west = lo / 32000 - 180;
  const grid = OLC[(la % 5) * 4 + (lo % 4)];
  la = Math.floor(la / 5); lo = Math.floor(lo / 4);
  let pairs = "";
  for (let i = 0; i < 5; i++) { pairs = OLC[la % 20] + OLC[lo % 20] + pairs; la = Math.floor(la / 20); lo = Math.floor(lo / 20); }
  return { code: pairs.slice(0, 8) + "+" + pairs.slice(8) + grid, sq: { southwest: { lat: south, lng: west }, northeast: { lat: south + 1 / 40000, lng: west + 1 / 32000 } } };
}
const pcLink = a => `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.code)}" target="_blank" rel="noopener" style="font-weight:700;font-family:ui-monospace,monospace;text-decoration:none">📍 ${esc(a.code)}</a>`;

const ago = t => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : when(t); };
async function viewMap() {
  setNav("map");
  $("#app").innerHTML = `<h1>Map</h1>
    <input id="mq" placeholder="🔍 Find a reg on the map" value="${esc(mapQuery)}" autocomplete="off" style="font-size:18px;text-transform:uppercase;margin-bottom:10px">
    <div id="map"></div><div id="maplist"></div>`;
  $("#mq").oninput = () => { mapQuery = $("#mq").value; mapFitted = false; updateMap(); };
  map = null; mapFitted = false;
  try { await loadLeaflet(); } catch { $("#map").outerHTML = `<div class="notice">Couldn't load the map.</div>`; return; }
  if (currentView !== "map" || !$("#map")) return;
  map = L.map("map", { zoomControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  mapLayer = L.layerGroup().addTo(map);
  map.setView([54.5, -3], 5);
  updateMap();
}
function updateMap() {
  if (!map || !$("#map")) return;
  const groups = mapGroups();
  mapLayer.clearLayers();
  const pts = [];
  for (const g of groups) {
    const ll = [g.pos.lat, g.pos.lng]; pts.push(ll);
    const colour = g.onBoard ? "#1a7f37" : "#d97706";
    g.pc = plusCode(g.pos.lat, g.pos.lng);
    if (g.pc) {
      const sq = g.pc.sq;   // the ~3 m square the key is in
      L.rectangle([[sq.southwest.lat, sq.southwest.lng], [sq.northeast.lat, sq.northeast.lng]], { color: colour, weight: 2, fillOpacity: .25 }).addTo(mapLayer);
    } else if (!g.onBoard && g.pos.acc) L.circle(ll, { radius: g.pos.acc, color: colour, weight: 1, fillOpacity: .08 }).addTo(mapLayer);
    L.circleMarker(ll, { radius: 10, color: "#fff", weight: 3, fillColor: colour, fillOpacity: 1 })
      .bindTooltip(`${g.onBoard ? "🗂" : "👤"} ${esc(g.name)} · ${g.keys.length}`, { permanent: true, direction: "top", offset: [0, -10], className: "mlabel" })
      .bindPopup(`<b>${esc(g.name)}</b><br>${g.keys.map(k => `${esc(vehicle(k.vehicleId)?.vrm || "?")} key ${k.n}`).join("<br>")}${g.pc ? "<br>" + pcLink(g.pc) : ""}<br><span style="color:#888">${g.onBoard ? "Put on board" : "Updated"} ${ago(g.pos.at)}</span>`)
      .addTo(mapLayer);
  }
  if (!mapFitted && pts.length) { map.fitBounds(pts, { padding: [40, 40], maxZoom: normReg(mapQuery) ? 19 : 17 }); mapFitted = true; }
  $("#maplist").innerHTML = groups.length ? groups.sort((a, b) => a.onBoard - b.onBoard || a.name.localeCompare(b.name)).map(g => `
    <div class="card" data-g="${esc(g.pos.lat + "," + g.pos.lng)}" style="cursor:pointer">
      <div class="row"><b class="grow">${g.onBoard ? "🗂" : "👤"} ${esc(g.name)}</b>
        <span class="pill ${g.onBoard ? "in" : "out"}">${g.onBoard ? "On board" : "Live"} · ${ago(g.pos.at)}</span></div>
      ${g.pc ? `<div style="margin-top:6px;font-size:17px">${pcLink(g.pc)}${g.pos.acc ? ` <span class="muted">· ±${g.pos.acc} m</span>` : ""}</div>` : ""}
      <div class="muted" style="margin-top:4px">${g.keys.map(k => `${esc(vehicle(k.vehicleId)?.vrm || "?")} key ${k.n}`).join(" · ")}</div>
    </div>`).join("") : normReg(mapQuery) ? `<div class="empty">No map location for "${esc(mapQuery)}"${matchingKeys(mapQuery).length ? `<br>${matchingKeys(mapQuery).map(k => `${esc(vehicle(k.vehicleId)?.vrm || "")} key ${k.n}: ${esc(whereText(k))}`).join("<br>")}` : ""}</div>`
    : `<div class="empty">No key locations yet. They appear once someone books in, takes or hands over keys with location allowed.</div>`;
  document.querySelectorAll("[data-g]").forEach(c => c.onclick = ev => { if (ev.target.closest("a")) return; const [a, b] = c.dataset.g.split(",").map(Number); map.setView([a, b], 19); window.scrollTo(0, 0); });
}
setInterval(() => { if (currentView === "map") updateMap(); }, 5000);   // keep "x s ago" fresh

/* ---------- router ---------- */
let ready = false, currentView = "";
function render() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/v\/([^/]+)/);
  currentView = h.startsWith("#/map") ? "map" : "";
  if (currentView === "map") viewMap();
  else if (m) viewVehicle(m[1]);
  else if (h.startsWith("#/do/")) { location.replace("#/"); viewActions(); }
  else if (h.startsWith("#/pegs/")) viewPegSetup(h.slice(7));
  else if (h.startsWith("#/peg/")) viewPeg(h.slice(6));
  else if (h.startsWith("#/book")) viewBook();
  else if (h.startsWith("#/keys") || h.startsWith("#/boards")) viewKeys();
  else if (h.startsWith("#/vehicles")) viewVehicles();
  else viewActions();
}
const ownsNfc = h => /^#\/pegs\//.test(h) || h.startsWith("#/book");   // these pages run their own scanning
function route() {
  pegWaiter = null; tapHandler = null; homeShown = null;
  stopSession(); if (!ready) return; render(); window.scrollTo(0, 0);
  if (!ownsNfc(location.hash)) startIdle();
}
window.addEventListener("hashchange", async () => { if (!ready) return; await load().catch(() => {}); route(); });
window.addEventListener("pageshow", e => { if (e.persisted && ready) load().then(route); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ready) refresh(); });

async function start() {
  if (sb) {
    const { data } = await sb.auth.getSession();
    const user = data.session?.user;
    if (!user) { renderWho(); viewLogin(); return; }
    signedInName = user.user_metadata?.name || user.email.split("@")[0];
  }
  document.querySelector("nav").style.display = "";
  renderWho();
  $("#app").innerHTML = `<div class="empty">Loading…</div>`;
  try { await load(); } catch (e) { $("#app").innerHTML = `<div class="notice">Couldn't load data: ${esc(e.message)}</div>`; return; }
  ready = true;
  renderOffers();
  goLive();
  ensureTracking();
  route();
}
start();
</script>
